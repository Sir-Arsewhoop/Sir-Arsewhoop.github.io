# ---------------------------------------------------------------------------
# Identity. These three values are the only ones you need to change.
# ---------------------------------------------------------------------------
title:    "Dex"
tagline:  "A blog?"
url:      "https://davedavis.co.uk"
baseurl:  ""

# Read by jekyll-seo-tag for <meta name="description">.
description: "A long forgotten blog where I'll probably mount some bad projects"
lang: en

# ---------------------------------------------------------------------------
# Build. No `theme:` key — every layout in this repo is ours, so nothing is
# inherited and nothing external can restyle the site.
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - docs/
  - test/
  - scripts/
  - vendor/
